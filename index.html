<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4.
         iOS auto-zoom on input focus is prevented by the 16px input font instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- WARNING: this script is pinned by a CSP hash in vercel.json. Editing
         ANY character of it — a space, a comment — changes that hash, and the
         browser then silently refuses to run it in production: no theme, no
         motion override, no text size, and a flash of the wrong one of each.
         Nothing errors and the dev server is unaffected, so it only shows up
         on the deployed site. tests/cspHashes.test.js recomputes both hashes
         and fails if they have drifted.

         Appearance preferences, applied before first paint. Mirrors
         src/utils/theme.js, motion.js and textScale.js (keep in sync).

         Text size has to be here more than the theme does: the theme flashes a
         wrong colour, but a late font-size change REFLOWS the entire page, and
         the reader who set it is by definition the one least able to follow
         text that jumps. Motion is here for the same reason in reverse — an
         entry animation that has already started cannot be un-started. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('gardnr-theme');
          if (p !== 'light' && p !== 'dark') {
            p = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', p);
        } catch (e) {}
        try {
          var m = localStorage.getItem('gardnr-motion');
          if (m === 'reduced' || m === 'full') {
            document.documentElement.setAttribute('data-motion', m);
          }
        } catch (e) {}
        try {
          var scales = { default: 1, large: 1.125, largest: 1.25 };
          var t = localStorage.getItem('gardnr-text-scale');
          if (scales[t]) {
            document.documentElement.style.setProperty('--text-scale', String(scales[t]));
          }
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />

    <style>
      /* Cold-start splash (esp. the mobile PWA): a black screen with the Gardnr
         mark that pulses while the app boots, then grows toward the viewer and
         fades to reveal the ready app — Netflix-style. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 1.5s ease;
      }
      #splash img {
        width: 132px;
        height: 132px;
        animation: splashPulse 1.8s ease-in-out infinite;
        will-change: transform, opacity;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 0.8; }
        50% { transform: scale(1.08); opacity: 1; }
      }
      #splash.splash-done { opacity: 0; pointer-events: none; }
      #splash.splash-done img {
        animation: splashReveal 1.5s cubic-bezier(0.45, 0, 0.75, 0.4) forwards;
      }
      @keyframes splashReveal {
        0% { transform: scale(1.08); opacity: 1; }
        60% { opacity: 1; }
        100% { transform: scale(10); opacity: 0; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img, #splash.splash-done img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" hidden><img src="/logo-icon.svg" alt="Gardnr" width="132" height="132" /></div>
    <div id="root"></div>
    <script>
      (function () {
        var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        var hasAuth = false;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.*-auth-token$/.test(localStorage.key(i) || '')) {
              hasAuth = true;
              break;
            }
          }
        } catch (e) {}
        var splash = document.getElementById('splash');
        if (!standalone && !hasAuth) {
          if (splash) splash.remove();
          window.hideSplash = function () {};
          return;
        }
        if (splash) splash.hidden = false;
        var start = Date.now();
        var MIN = 900; // show the pulse at least this long before the zoom-reveal
        function reveal() {
          var s = document.getElementById('splash');
          if (!s || s.classList.contains('splash-done')) return;
          clearTimeout(window.__splashTimer);
          s.classList.add('splash-done');
          setTimeout(function () { if (s.parentNode) s.remove(); }, 1600);
        }
        window.hideSplash = function () {
          setTimeout(reveal, Math.max(0, MIN - (Date.now() - start)));
        };
        // Safety net: never trap the user on the splash if the app stalls.
        window.__splashTimer = setTimeout(reveal, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
