<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- No maximum-scale / user-scalable=no: blocking pinch-zoom fails WCAG 1.4.4.
         iOS auto-zoom on input focus is prevented by the 16px input font instead. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- WARNING: this script is pinned by a CSP hash in vercel.json. Editing
         ANY character of it — a space, a comment — changes that hash, and the
         browser then silently refuses to run it in production: no theme, no
         motion override, no text size, and a flash of the wrong one of each.
         Nothing errors and the dev server is unaffected, so it only shows up
         on the deployed site. tests/cspHashes.test.js recomputes both hashes
         and fails if they have drifted.

         Appearance preferences, applied before first paint. Mirrors
         src/utils/theme.js, motion.js and textScale.js (keep in sync).

         Text size has to be here more than the theme does: the theme flashes a
         wrong colour, but a late font-size change REFLOWS the entire page, and
         the reader who set it is by definition the one least able to follow
         text that jumps. Motion is here for the same reason in reverse — an
         entry animation that has already started cannot be un-started. -->
    <script>
      (function () {
        try {
          var p = localStorage.getItem('gardnr-theme');
          if (p !== 'light' && p !== 'dark') {
            p = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', p);
        } catch (e) {}
        try {
          var m = localStorage.getItem('gardnr-motion');
          if (m === 'reduced' || m === 'full') {
            document.documentElement.setAttribute('data-motion', m);
          }
        } catch (e) {}
        try {
          var scales = { default: 1, large: 1.125, largest: 1.25 };
          var t = localStorage.getItem('gardnr-text-scale');
          if (scales[t]) {
            document.documentElement.style.setProperty('--text-scale', String(scales[t]));
          }
        } catch (e) {}
      })();
    </script>

    <style>
      /* Cold-start splash (the iPhone app and the installed PWA).
         It is the native launch screen continued, pixel for pixel
         (ios/App/App/Base.lproj/LaunchScreen.storyboard): the theme's
         background and the 96px mark dead centre, so iOS handing over to the
         web view is not seen. It used to be a black screen at another size
         and position, held for at least 0.9s, ending in a 1.5s zoom of the
         mark to ten times its size over the app: a jump, a wait and a wash of
         green over the sign-in form. Apple's own apps go straight in.
         Now: still while it is quick, a slow breath only if loading runs past
         a second, and a 250ms fade the moment the app is ready. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        background: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: opacity 250ms ease-out;
      }
      :root[data-theme="light"] #splash { background: #f4f5f4; }
      #splash img {
        width: 96px;
        height: 96px;
        animation: splashBreath 1.8s ease-in-out 1s infinite;
      }
      @keyframes splashBreath {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.6; }
      }
      #splash.splash-done { opacity: 0; pointer-events: none; }
      @media (prefers-reduced-motion: reduce) {
        #splash img { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" hidden><img src="/logo-icon.svg" alt="Gardnr" width="96" height="96" /></div>
    <div id="root"></div>
    <script>
      (function () {
        var standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
        var hasAuth = false;
        try {
          for (var i = 0; i < localStorage.length; i++) {
            if (/^sb-.*-auth-token$/.test(localStorage.key(i) || '')) {
              hasAuth = true;
              break;
            }
          }
        } catch (e) {}
        // The iPhone app always shows it: it is what covers the launch screen
        // until the first page is drawn, signed in or not.
        var native = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
        var splash = document.getElementById('splash');
        if (!standalone && !hasAuth && !native) {
          if (splash) splash.remove();
          window.hideSplash = function () {};
          return;
        }
        if (splash) splash.hidden = false;
        function reveal() {
          var s = document.getElementById('splash');
          if (!s || s.classList.contains('splash-done')) return;
          clearTimeout(window.__splashTimer);
          s.classList.add('splash-done');
          setTimeout(function () { if (s.parentNode) s.remove(); }, 300);
        }
        // No minimum: an app that is ready is shown, once the screen it opens
        // on is there, so the page's own fade-in runs under this one and the
        // two read as one crossfade. "There" is anything visible in <main>
        // (or, for the screens drawn without one, in #root) that is not a
        // loader (role=status): a rule about the page, not a list of pages.
        // Hidden kept-alive tabs do not count. Never waited on past 1.5s.
        // A display:contents wrapper (the kept tabs) has no box of its own,
        // so it is looked through to what it holds.
        function shown(el) {
          if (el.getAttribute('role') === 'status') return false;
          if (getComputedStyle(el).display === 'contents') return [].some.call(el.children, shown);
          return el.getClientRects().length > 0;
        }
        function screenReady() {
          var root = document.getElementById('root');
          if (!root) return false;
          var mains = root.querySelectorAll('main');
          var parents = mains.length ? mains : [root];
          for (var i = 0; i < parents.length; i++) {
            if ([].some.call(parents[i].children, shown)) return true;
          }
          return false;
        }
        window.hideSplash = function () {
          var t0 = Date.now();
          (function poll() {
            if (screenReady() || Date.now() - t0 > 1500) {
              requestAnimationFrame(function () { requestAnimationFrame(reveal); });
            } else {
              requestAnimationFrame(poll);
            }
          })();
        };
        // Safety net: never trap the user on the splash if the app stalls.
        window.__splashTimer = setTimeout(reveal, 8000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
